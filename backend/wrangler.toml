# USVetHub admin Worker.
#
# Nothing secret lives in this file. The database id is an identifier, not a
# credential, and the Access values below are public identifiers too. Anything
# that IS a secret goes in `wrangler secret put`, never here, because this file
# is committed to a public repository.
#
# Deploy:
#   npx wrangler deploy --config backend/wrangler.toml
#
# Apply the schema (once, and after any schema change):
#   npx wrangler d1 execute usvethub-admin --remote --file=backend/schema.sql

name = "usvethub-admin"
main = "src/index.mjs"
compatibility_date = "2026-08-30"
workers_dev = true

# Its own database, shared with nothing else on the account. A compromise of
# another project on this Cloudflare account does not reach this data.
[[d1_databases]]
binding = "DB"
database_name = "usvethub-admin"
database_id = "2d276019-e27a-42b6-bb18-125097073256"

[vars]
# From Zero Trust > Access > Applications, set 2026-08-31.
#
# Neither is a credential, which is why they are here rather than in
# `wrangler secret put`. The AUD tag names WHICH application a token was minted
# for; it grants nothing on its own, because forging a token would take
# Cloudflare's private signing key. Its job is the opposite: the Worker refuses
# any assertion whose aud is not this exact value, so a valid login to another
# Access application on this account is not a login to this one. That check is
# load-bearing here, because the team domain below is shared with the
# token-curb applications and every app on it is signed by the same keys.
#
# The Worker refuses every request unless both are set. An admin system that
# runs without an identity check is worse than one that does not run at all.
ACCESS_TEAM_DOMAIN = "tokencurb.cloudflareaccess.com"
ACCESS_AUD = "cfff81537894f5caf5da60ad496bfe4169130cfec2e8179eef0255b1113dfe01"
